version: '3.8'

services:
  # Reverse proxy con TLS automático (Let's Encrypt).
  # Único punto de entrada público: termina HTTPS y reenvía a la app.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - saml-network
    restart: unless-stopped

  # Aplicación principal SAML SSO
  app:
    build: .
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      PROTOCOL: https
      HTTPS_ONLY: "true"
      SAML_SP_ENTITY_ID: https://${PUBLIC_DOMAIN:-localhost}
      SAML_SP_ACS_URL: https://${PUBLIC_DOMAIN:-localhost}/saml/acs
      SAML_SP_SLO_URL: https://${PUBLIC_DOMAIN:-localhost}/saml/slo
      SAML_SP_CERT_PATH: /app/certificates/sp.crt
      SAML_SP_KEY_PATH: /app/certificates/sp.key
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgresql://saml:saml@postgres:5432/saml_sso
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      LOG_LEVEL: info
    volumes:
      - ./certificates:/app/certificates
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - saml-network
    restart: unless-stopped

  # Redis para sesiones
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - saml-network
    restart: unless-stopped

  # PostgreSQL para auditoría y datos
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: saml
      POSTGRES_PASSWORD: saml
      POSTGRES_DB: saml_sso
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saml"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - saml-network
    restart: unless-stopped

  # Adminer para gestión de BD (solo desarrollo — perfil 'dev-tools')
  adminer:
    image: adminer:latest
    profiles: ["dev-tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - saml-network
    restart: unless-stopped

  # Redis Commander para gestión de Redis (solo desarrollo — perfil 'dev-tools')
  redis-commander:
    image: rediscommander/redis-commander:latest
    profiles: ["dev-tools"]
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: default:redis:6379
    depends_on:
      - redis
    networks:
      - saml-network
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  saml-network:
    driver: bridge
